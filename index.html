<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fútbol Total Hoy</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }
    header {
      background-color: #1a1a1a;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .content {
      padding: 20px;
    }
    .match {
      background: white;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .btn-ver {
      display: inline-block;
      background-color: #28a745;
      color: white;
      padding: 10px 15px;
      border-radius: 5px;
      text-decoration: none;
    }
    .btn-ver:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <header>
    <h1>Fútbol Total Hoy</h1>
    <p>Partidos en vivo de hoy</p>
  </header>

  <div class="content" id="matches-container">Cargando partidos...</div>

  <script>
    const API_KEY = "a50ea097aa3c8b8b56238bff4fa401bd";
    const container = document.getElementById("matches-container");

    async function obtenerPartidos() {
      const hoy = new Date().toISOString().split('T')[0];
      const url = `https://apiv3.apifootball.com/?action=get_events&from=${hoy}&to=${hoy}&APIkey=${API_KEY}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        container.innerHTML = "";

        data.forEach(p => {
          const div = document.createElement("div");
          div.className = "match";
          div.innerHTML = `
            <h3>${p.event_home_team} vs ${p.event_away_team}</h3>
            <p>Liga: ${p.league_name}</p>
            <p>Hora: ${p.event_time}</p>
            <a class="btn-ver" href="#" target="_blank">Ver partido</a>
          `;
          container.appendChild(div);
        });

        if (data.length === 0) {
          container.innerHTML = "<p>No hay partidos para hoy.</p>";
        }

      } catch (error) {
        container.innerHTML = "<p>Error al cargar los partidos.</p>";
        console.error("Error:", error);
      }
    }

    obtenerPartidos();
  </script>
</body>
</html>
